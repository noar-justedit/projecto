appId: fr.just-edit.projecto
productName: projecto
copyright: "Copyright © 2026 Just Edit"
compression: maximum
asar: true
directories:
  buildResources: build-resources
files:
  - src/**/*
  - package.json
  - build-resources/*.ico
  - build-resources/*.icns
  - build-resources/*.plist
  - "READ ME FIRST.txt"

mac:
  category: public.app-category.productivity
  icon: build-resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  title: "projecto"
  writeUpdateInfo: false
  icon: null
  window:
    width: 540
    height: 400
  contents:
    - x: 150
      y: 160
      type: file
    - x: 390
      y: 160
      type: link
      path: /Applications
    - x: 270
      y: 320
      type: file
      path: "READ ME FIRST.txt"

win:
  icon: build-resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: projecto
  menuCategory: "just edit"
  deleteAppDataOnUninstall: false
  license: build-resources/license.txt
  installerLanguages:
    - en_US
    - fr_FR
