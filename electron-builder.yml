appId: fr.just-edit.projecto
productName: projecto
copyright: "Copyright © 2026 Just Edit"
compression: maximum
asar: true
directories:
  buildResources: build-resources
files:
  - src/**/*
  - package.json

mac:
  category: public.app-category.productivity
  icon: build-resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  # Notarisation : electron-builder la déclenche automatiquement dès que les
  # variables d'environnement d'identification sont présentes. build-mac.command
  # exporte APPLE_KEYCHAIN_PROFILE=projecto-notarization (profil notarytool
  # stocké dans le trousseau — aucun secret dans le dépôt).
  # Mettre `false` ici désactiverait la notarisation même avec les variables.
  notarize: true
  # Textes affichés par macOS quand l'app demande l'accès à un dossier protégé.
  # Sans eux, la demande d'autorisation est muette et peut être refusée.
  extendInfo:
    NSDesktopFolderUsageDescription: "projecto needs access to your Desktop to create project folders there."
    NSDocumentsFolderUsageDescription: "projecto needs access to your Documents folder to create project folders there."
    NSDownloadsFolderUsageDescription: "projecto needs access to your Downloads folder to read ZIP templates and create project folders there."
    NSRemovableVolumesUsageDescription: "projecto needs access to external drives to create project folders on them."
    NSNetworkVolumesUsageDescription: "projecto needs access to network volumes to create project folders on your server or NAS."
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  title: "projecto"
  writeUpdateInfo: false
  icon: null
  # Le DMG est signé par scripts/build-mac.command, après sa fabrication et avant
  # de l'envoyer à Apple (ordre imposé : signer → notariser → agrafer).
  # On ne laisse pas electron-builder s'en charger : sa propre doc déconseille
  # dmg.sign en présence de notarisation.
  sign: false
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 180
      type: file
    - x: 390
      y: 180
      type: link
      path: /Applications

win:
  icon: build-resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: projecto
  menuCategory: "just edit"
  deleteAppDataOnUninstall: false
  license: build-resources/license.txt
  installerLanguages:
    - en_US
    - fr_FR
